<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisori</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="navbar text-center">
        <h1 class="text-uppercase">Script javascript</h1>
        <p>Una collezione di scrpt Javascript</p>
    </div>

    <div class="row p-5">
        <div
            class="col-12 col-md-3 justify-content-center align-items-center text-center flex-column pt-3 border border-dark-subtle">
            <h1 class="text-primary fw-bold text-uppercase">Cosa fa lo script</h1>
        </div>
        <div
            class="col-6 col-md-5 justify-content-center align-items-center text-center flex-column pt-3 border border-warning">
            <h1 class="text-primary fw-bold text-uppercase">Il tuo input</h1>
            <div class="input-group mb-3">
                <input id="inputNumero" type="text" class="form-control" placeholder="Inserisci numero">
                <button id="calcola" class="btn btn-outline-secondary" type="button">Calcola</button>
            </div>
        </div>
        <div
            class="col-6 col-md-4 justify-content-center align-items-center text-center flex-column pt-3 border border-dark-subtle">
            <h1 class="text-primary fw-bold text-uppercase">Il risultato</h1>
            <p id="output"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/js/script.js"></script>
</body>

</html>
