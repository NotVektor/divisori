<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisori</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="flex-column pt-3 navbar text-center bg-warning justify-content-center align-items-center">
        <h1 class="text-uppercase fw-bold">Script javascript</h1>
        <p>Una collezione di scrpt Javascript</p>
    </div>

    <div class="row p-5">
        <div
            class="col-12 col-md-3 flex-column pt-3 justify-content-center align-items-center text-center border border-dark-subtle">
            <h1 class="text-primary text-uppercase">Cosa fa lo script</h1>
            <img 
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/JavaScript_shield_logo_(no_text).svg/500px-JavaScript_shield_logo_(no_text).svg.png"
                alt="js"
                class="w-75">
            <p class="p-1 bg-primary text-light rounded rounded-2 overflow-hidden">Inserisci il numero e lo script calcolera' i divisori</p>
        </div>
        <div
            class="col-6 col-md-5 flex-column pt-3 justify-content-center align-items-center text-center border border-warning">
            <h1 class="text-primary text-uppercase">Il tuo input</h1>
            <div class="mb-3 input-group mt-3">
                <input id="inputNumero" type="text" class="form-control" placeholder="Inserisci numero">
                <button id="calcola" class="btn btn-outline-secondary" type="button">Calcola</button>
            </div>
        </div>
        <div
            class="col-6 col-md-4 flex-column pt-3 justify-content-center align-items-center text-center border border-dark-subtle">
            <h1 class="text-primary text-uppercase">Il risultato</h1>
            <div id="outputBox" class="d-none rounded rounded-2">
                <p id="output"></p>
                <p id="outputArray"></p>
            </div>
            <div id="spinner" class="spinner-border text-danger mt-3"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/js/script.js"></script>
</body>

</html>
